# Сборка Android-приложения: при каждом изменении папки android/ в main GitHub сам собирает APK
# и выкладывает его на страницу Releases (ссылка «VSmske.apk» в релизе «Приложение для Android»).
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../VSmske.apk
      - name: Номер версии
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Приложение для Android
          make_latest: true
          body: |
            **VСмске для Android ${{ steps.ver.outputs.name }}**

            Как установить: скачайте файл **VSmske.apk** ниже и откройте его. Если Android спросит —
            разрешите установку из этого источника. Новая версия ставится поверх старой, вход сохраняется.

            Сборка от ${{ github.event.head_commit.timestamp || 'ручного запуска' }}.
          files: VSmske.apk
