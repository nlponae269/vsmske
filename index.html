<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VСмске</title>
<script>
/* Адрес, спрятанный 404.html (…/?/im/abc), возвращаем на место; <base> — чтобы стили и скрипты находились на любой глубине адреса. */
(function (l) {
  var keep = l.pathname.indexOf('/vsmske/') === 0 ? '/vsmske/' : '/';
  document.write('<base href="' + keep + '">');
  if (l.search[1] === '/') {
    var d = l.search.slice(1).split('&').map(function (s) { return s.replace(/~and~/g, '&'); }).join('?');
    history.replaceState(null, '', keep.slice(0, -1) + d + l.hash);
  }
  try { var t = localStorage.getItem('vs_theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) { }
})(window.location);
</script>
<meta name="description" content="VСмске — лента друзей, переписка и звонки, музыка, видео и клипы.">
<meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VСмске">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css?v=9.0">
</head>
<body>
<div id="app"><div class="boot"><span class="logo-mark">вс</span></div></div>
<script type="module" src="js/main.js?v=9.0"></script>
</body>
</html>
