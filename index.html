<script>
/* Адреса без решётки (6.9). Папка сайта: на GitHub Pages «/vsmske/», при запуске с корня — «/». <base> нужен, чтобы стили и скрипты находились и на адресах вроде /vsmske/live/abc.
   Страница 404.html присылает сюда глубокие адреса как /vsmske/?/live/abc — возвращаем обычный адрес до того, как запустится сайт. */
(function (l) {
  var b = l.pathname.indexOf('/vsmske/') === 0 || l.pathname === '/vsmske' ? '/vsmske/' : '/';
  document.write('<base href="' + b + '">');
  if (l.search.charAt(1) === '/') {
    var d = l.search.slice(1).split('&').map(function (x) { return x.replace(/~and~/g, '&'); }).join('?');
    history.replaceState(null, '', b.slice(0, -1) + d + l.hash);
  }
})(window.location);
</script>
