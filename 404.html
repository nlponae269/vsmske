<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>VСмске</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{height:100%;margin:0;background:#FBF7F2;color:#1B1A1F;font:16px system-ui,sans-serif;display:grid;place-items:center}</style>
<script>
/* GitHub Pages открывает эту страницу на любой «глубокий» адрес (например /vsmske/im/abc). Переходим на главную,
   а нужный адрес прячем после «?/» — index.html вернёт его на место, и сайт откроет нужную страницу. */
(function (l) {
  var keep = l.pathname.indexOf('/vsmske/') === 0 ? 1 : 0, parts = l.pathname.split('/');
  l.replace(l.protocol + '//' + l.host + parts.slice(0, 1 + keep).join('/') + '/?/' +
    parts.slice(1 + keep).join('/').replace(/&/g, '~and~') + (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
})(window.location);
</script>
</head>
<body>VСмске…</body>
</html>
